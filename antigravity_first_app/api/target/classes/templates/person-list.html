<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Alle Personen</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
        }

        h1 {
            margin-top: 0;
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th,
        td {
            text-align: left;
            padding: 0.75rem;
            border-bottom: 1px solid #eee;
        }

        th {
            background-color: #f8f9fa;
            color: #555;
        }

        .footer {
            margin-top: 2rem;
        }

        a {
            text-decoration: none;
            color: #007bff;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Alle erfassten Personen</h1>

        <table th:if="${not #lists.isEmpty(persons)}">
            <thead>
                <tr>
                    <th>Vorname</th>
                    <th>Nachname</th>
                    <th>Geburtsdatum</th>
                    <th>Verheiratet</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${persons}">
                    <td th:text="${p.vorname}"></td>
                    <td th:text="${p.nachname}"></td>
                    <td th:text="${p.birthDate}"></td>
                    <td th:text="${p.verheiratet ? 'Ja' : 'Nein'}"></td>
                </tr>
            </tbody>
        </table>

        <p th:if="${#lists.isEmpty(persons)}">Noch keine Personen erfasst.</p>

        <div class="footer">
            <a href="/">Zurück zum Formular</a>
        </div>
    </div>
</body>

</html>
