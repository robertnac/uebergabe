<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Ergebnis</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
            color: #333;
        }

        p {
            color: #555;
        }

        a {
            text-decoration: none;
            color: #007bff;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Erfasste Person</h1>
        <p th:text="'Vorname: ' + ${person.vorname}" />
        <p th:text="'Nachname: ' + ${person.nachname}" />
        <p th:text="'Verheiratet: ' + (${person.verheiratet} ? 'Ja' : 'Nein')" />
        <div style="margin-top: 1.5rem; display: flex; gap: 1rem;">
            <a href="/">Neuer Eintrag</a>
            <span style="color: #ccc;">|</span>
            <a href="/persons">Alle Personen anzeigen</a>
        </div>
    </div>
</body>

</html>
